name: Deploy NEVERENDING GAME
# Static Vite pipeline
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/configure-pages@v5
      - run: bun install
      - run: bunx vite build --config vite.game.config.ts
      - run: |
          mkdir -p _site
          if [ -d .output/public ]; then cp -R .output/public/. _site/; elif [ -d dist ]; then cp -R dist/. _site/; elif [ -d dist/client ]; then cp -R dist/client/. _site/; else echo "No static build output"; exit 1; fi
          touch _site/.nojekyll
          cp _site/index.html _site/404.html
          if [ ! -f _site/index.html ]; then echo "No index.html in Pages artifact"; exit 1; fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test published game
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "Testing $url"
          code=$(curl -L -s -o /tmp/page.html -w "%{http_code}" "$url")
          test "$code" = "200"
          grep -q "<title>" /tmp/page.html
