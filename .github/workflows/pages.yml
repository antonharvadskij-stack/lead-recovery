name: Deploy NEVERENDING GAME
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/configure-pages@v5
      - run: bun install
      - run: bun run build
      - name: Ensure Pages entrypoint exists
        run: |
          if [ ! -f _site/index.html ]; then
            echo "Build output did not contain index.html"
            find .output dist -maxdepth 4 -type f -name 'index.html' -print 2>/dev/null || true
            exit 1
          fi
      - run: |
          mkdir -p _site
          if [ -d .output/public ]; then cp -R .output/public/. _site/; elif [ -d dist/client ]; then cp -R dist/client/. _site/; elif [ -d dist ]; then cp -R dist/. _site/; else echo "No static build output"; exit 1; fi
          touch _site/.nojekyll
          if [ ! -f _site/index.html ]; then echo "No index.html in Pages artifact"; exit 1; fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
