<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Последний остров</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07111d;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:14px;gap:8px}.pill{pointer-events:auto;background:#07111dcc;border:1px solid #ffffff22;border-radius:16px;padding:9px 12px;font-weight:800;backdrop-filter:blur(8px)}#event{position:absolute;top:75px;left:50%;transform:translateX(-50%);background:#ffd45a;color:#10151c;padding:9px 15px;border-radius:18px;font-weight:900;display:none}
#controls{position:absolute;bottom:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:end}.joystick{width:118px;height:118px;border-radius:50%;background:#ffffff14;border:1px solid #ffffff25;pointer-events:auto;position:relative}.stick{width:48px;height:48px;border-radius:50%;background:#ffffff55;position:absolute;left:35px;top:35px}.buttons{display:flex;gap:9px;pointer-events:auto}.action{width:72px;height:72px;border:0;border-radius:20px;background:#ffd45a;color:#111;font-size:12px;font-weight:900;box-shadow:0 5px 0 #0004}.action.dark{background:#ffffffdd}.hint{position:absolute;bottom:145px;left:50%;transform:translateX(-50%);background:#07111dcc;border-radius:14px;padding:8px 12px;font-size:12px;white-space:nowrap;opacity:.85}
#panel{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(430px,calc(100% - 24px));background:#0b1420f2;border:1px solid #ffffff1c;border-radius:24px;padding:16px;display:none;pointer-events:auto;box-shadow:0 20px 60px #0008}.panelrow{display:flex;justify-content:space-between;margin:7px 0}.btn{width:100%;border:0;border-radius:15px;padding:13px;background:#ffd45a;font-weight:900;margin-top:8px}.close{background:#ffffff12;color:#fff}
</style></head><body>
<div id="game"></div><div id="hud"><div class="top"><div class="pill">🪵 <span id="wood">20</span></div><div class="pill">🪙 <span id="coins">100</span></div><div class="pill">❤️ <span id="hp">100</span></div><button class="pill" id="menu">☰</button></div><div id="event"></div><div class="hint" id="hint">Собери дерево и построй убежище</div>
<div id="controls"><div class="joystick" id="joy"><div class="stick" id="stick"></div></div><div class="buttons"><button class="action" id="collect">🪓<br>СОБРАТЬ</button><button class="action dark" id="build">🏠<br>СТРОИТЬ</button></div></div></div>
<div id="panel"><h2 style="margin:0 0 10px">ПОСЛЕДНИЙ ОСТРОВ</h2><div class="panelrow"><span>День</span><b id="day">1</b></div><div class="panelrow"><span>Дерево</span><b id="pwood"></b></div><div class="panelrow"><span>Монеты</span><b id="pcoins"></b></div><div class="panelrow"><span>Построено</span><b id="built"></b></div><button class="btn close" id="close">Продолжить</button></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
<script>
(()=>{const $=id=>document.getElementById(id);let s=JSON.parse(localStorage.island3d||'null')||{wood:20,coins:100,hp:100,built:0,day:1,trees:8,last:Date.now()};
const scene=new THREE.Scene();scene.background=new THREE.Color(0x72c8e5);scene.fog=new THREE.Fog(0x72c8e5,18,42);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);camera.position.set(8,9,11);camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;$('game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdff7ff,0x34543a,2));const sun=new THREE.DirectionalLight(0xffffff,2.4);sun.position.set(6,12,5);sun.castShadow=true;scene.add(sun);
const water=new THREE.Mesh(new THREE.CylinderGeometry(15,15,.35,64),new THREE.MeshStandardMaterial({color:0x35a8cf,roughness:.8}));water.position.y=-.7;scene.add(water);
const island=new THREE.Mesh(new THREE.CylinderGeometry(7.2,7.8,1.2,32),new THREE.MeshStandardMaterial({color:0x6db94f,roughness:1}));island.position.y=-.05;island.receiveShadow=true;scene.add(island);
const sand=new THREE.Mesh(new THREE.CylinderGeometry(6.9,7.5,.18,32),new THREE.MeshStandardMaterial({color:0xd8c77b}));sand.position.y=.58;scene.add(sand);
const group=new THREE.Group();scene.add(group);
function tree(x,z){let g=new THREE.Group();let tr=new THREE.Mesh(new THREE.CylinderGeometry(.18,.24,1.4,8),new THREE.MeshStandardMaterial({color:0x76502e}));tr.position.y=1.2;tr.castShadow=true;g.add(tr);let lf=new THREE.Mesh(new THREE.SphereGeometry(.72,10,8),new THREE.MeshStandardMaterial({color:0x257a3d}));lf.position.y=2;lf.castShadow=true;g.add(lf);g.position.set(x,.5,z);group.add(g);return g}
for(let i=0;i<s.trees;i++){let a=Math.random()*Math.PI*2,r=2.8+Math.random()*2.5;tree(Math.cos(a)*r,Math.sin(a)*r)}
const player=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.28,.65,4,8),new THREE.MeshStandardMaterial({color:0xffd45a}));body.position.y=1;body.castShadow=true;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.32,12,10),new THREE.MeshStandardMaterial({color:0xffc49a}));head.position.y=1.72;head.castShadow=true;player.add(head);player.position.set(0,.55,0);scene.add(player);
let house=null,vel={x:0,z:0},drag=null,move={x:0,z:0},eventTimer=0,last=performance.now();
function spawnTree(){let a=Math.random()*6.28,r=2+Math.random()*4.2;tree(Math.cos(a)*r,Math.sin(a)*r)}
function collect(){if(s.wood>=99){$('hint').textContent='Рюкзак полон';return}s.wood+=5; if(Math.random()<.22){s.coins+=10;$('hint').textContent='Нашёл 10 монет!'}else $('hint').textContent='Дерево +5';render();save()}
function build(){if(house){$('hint').textContent='Убежище уже построено';return}if(s.wood<30){$('hint').textContent='Нужно 30 дерева';return}s.wood-=30;s.built=1;house=new THREE.Group();let b=new THREE.Mesh(new THREE.BoxGeometry(2.3,1.5,2),new THREE.MeshStandardMaterial({color:0x9b633b}));b.position.y=1.25;b.castShadow=true;house.add(b);let r=new THREE.Mesh(new THREE.ConeGeometry(1.7,1.1,4),new THREE.MeshStandardMaterial({color:0x9d3030}));r.position.y=2.55;r.rotation.y=Math.PI/4;r.castShadow=true;house.add(r);house.position.set(0,.55,-2.2);scene.add(house);$('hint').textContent='Убежище построено! Ночью оно спасёт тебя.';render();save()}
function event(){eventTimer=1;let n=Math.floor(Math.random()*4);if(n===0){s.coins+=50;$('event').textContent='☄️ Метеорит! Ты нашёл редкую руду +50 🪙'}if(n===1){s.hp=Math.max(10,s.hp-25);$('event').textContent='🌊 Большая волна! −25 здоровья'}if(n===2){s.wood+=15;$('event').textContent='🌪️ Шторм повалил деревья! +15 🪵'}if(n===3){s.coins+=100;$('event').textContent='💎 Сундук на берегу! +100 🪙'}$('event').style.display='block';setTimeout(()=>{$('event').style.display='none'},2500);s.day++;render();save()}
function save(){localStorage.island3d=JSON.stringify(s)}
function render(){$('wood').textContent=s.wood;$('coins').textContent=s.coins;$('hp').textContent=s.hp;$('day').textContent=s.day;$('pwood').textContent=s.wood;$('pcoins').textContent=s.coins;$('built').textContent=s.built?'Да':'Нет'}
function loop(t){let d=Math.min(.05,(t-last)/1000);last=t;player.position.x+=move.x*3*d;player.position.z+=move.z*3*d;let q=6.1,dist=Math.hypot(player.position.x,player.position.z);if(dist>q){player.position.x*=q/dist;player.position.z*=q/dist}camera.position.x=player.position.x+8;camera.position.z=player.position.z+11;camera.lookAt(player.position.x,0,player.position.z);if(Math.floor(t/1000)%30===0&&t-last<.01){}renderer.render(scene,camera);requestAnimationFrame(loop)}
function joyStart(e){drag=e.touches?e.touches[0]:e;moveJoy(drag.clientX,drag.clientY);document.onmousemove=ev=>moveJoy(ev.clientX,ev.clientY);document.ontouchmove=ev=>{ev.preventDefault();moveJoy(ev.touches[0].clientX,ev.touches[0].clientY)};document.onmouseup=joyEnd;document.ontouchend=joyEnd}
function moveJoy(x,y){let r=$('joy').getBoundingClientRect(),dx=x-(r.left+r.width/2),dy=y-(r.top+r.height/2),m=Math.min(38,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);$('stick').style.transform='translate('+Math.cos(a)*m+'px,'+Math.sin(a)*m+'px)';move.x=Math.cos(a)*m/38;move.z=Math.sin(a)*m/38}
function joyEnd(){move={x:0,z:0};$('stick').style.transform='';document.onmousemove=null;document.ontouchmove=null}
$('joy').ontouchstart=joyStart;$('joy').onmousedown=joyStart;$('collect').onclick=collect;$('build').onclick=build;$('menu').onclick=()=>{$('pwood').textContent=s.wood;$('pcoins').textContent=s.coins;$('panel').style.display='block'};$('close').onclick=()=>$('panel').style.display='none';
setInterval(()=>{if(Math.random()<.7)event()},45000);setInterval(()=>{if(s.built)s.coins+=10;save();render()},60000);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});render();requestAnimationFrame(loop);
})();</script></body></html>
