<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#173f67"/><stop offset=".55" stop-color="#f08b62"/><stop offset="1" stop-color="#ffd79a"/></linearGradient>
 <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#155b78"/><stop offset="1" stop-color="#062d48"/></linearGradient>
 <linearGradient id="ground" x2="0" y2="1"><stop stop-color="#3b9b4f"/><stop offset="1" stop-color="#165735"/></linearGradient>
 <linearGradient id="wood" x2="0" y2="1"><stop stop-color="#8a542f"/><stop offset="1" stop-color="#3f2419"/></linearGradient>
 <linearGradient id="roof" x2="0" y2="1"><stop stop-color="#d35c39"/><stop offset="1" stop-color="#6d2825"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-opacity=".5"/></filter>
 <pattern id="waves" width="100" height="36" patternUnits="userSpaceOnUse"><path d="M0 18 Q25 4 50 18 T100 18" fill="none" stroke="#7ed8e9" stroke-opacity=".18" stroke-width="3"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
<circle cx="1260" cy="170" r="92" fill="#fff1bb" opacity=".9" filter="url(#glow)"/>
<!-- distant volcanic mountains -->
<path d="M0 360 L220 175 330 290 470 120 650 335 825 210 960 330 1110 145 1300 335 1450 225 1600 350V520H0Z" fill="#17394d"/>
<path d="M760 360 L930 85 1100 360Z" fill="#27383f"/>
