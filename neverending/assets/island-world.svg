<path d="M115 625 Q155 485 330 430 Q510 375 715 420 Q910 380 1115 470 Q1310 555 1375 700 Q1230 825 1030 840 Q800 890 555 850 Q310 820 150 750Z" fill="#d3aa63" filter="url(#shadow)"/>
