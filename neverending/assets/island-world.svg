<g fill="#ff8a2a" filter="url(#glow)"><circle cx="310" cy="620" r="9"/><circle cx="605" cy="625" r="9"/><circle cx="820" cy="585" r="9"/><circle cx="1050" cy="650" r="9"/></g>
</svg>