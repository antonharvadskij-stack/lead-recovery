<g fill="#0e4b31">
<circle cx="205" cy="570" r="72"/><circle cx="290" cy="500" r="66"/><circle cx="390" cy="485" r="72"/><circle cx="1110" cy="535" r="70"/><circle cx="1205" cy="600" r="82"/><circle cx="1180" cy="730" r="65"/><circle cx="440" cy="760" r="72"/><circle cx="330" cy="700" r="80"/>
</g>
<g fill="#247a43">
<circle cx="180" cy="590" r="48"/><circle cx="285" cy="520" r="45"/><circle cx="385" cy="510" r="48"/><circle cx="1080" cy="550" r="48"/><circle cx="1200" cy="615" r="54"/><circle cx="1160" cy="715" r="48"/><circle cx="450" cy="750" r="48"/>
</g>
