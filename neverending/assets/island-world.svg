 <g transform="translate(1020 730)"><rect x="-10" y="-100" width="20" height="100" fill="#5a3824"/><path d="M0-170 Q-75-130-38-78 Q-80-72-45-28 Q0-58 45-28 Q80-72 38-78 Q75-130 0-170Z" fill="#1d6e3f"/></g>
 <g transform="translate(1230 500)"><rect x="-9" y="-90" width="18" height="90" fill="#5a3824"/><path d="M0-155 Q-70-120-35-70 Q-75-65-40-20 Q0-50 40-20 Q75-65 35-70 Q70-120 0-155Z" fill="#236f3d"/></g>
</g>
