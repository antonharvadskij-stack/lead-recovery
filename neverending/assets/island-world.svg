<g filter="url(#shadow)">
 <path d="M360 585 L475 525 590 585 590 700 360 700Z" fill="url(#wood)"/>
 <path d="M340 585 L475 485 610 585 575 605 475 535 375 605Z" fill="url(#roof)"/>
 <rect x="445" y="625" width="48" height="75" rx="5" fill="#2b1b18"/>
