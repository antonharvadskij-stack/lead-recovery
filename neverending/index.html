<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>NEVERENDING</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06080d;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}body{display:flex;justify-content:center}
#app{position:relative;width:min(100vw,520px);height:100dvh;overflow:hidden;background:radial-gradient(circle at 50% 22%,#263653 0,#101522 43%,#06080d 100%)}canvas{position:absolute;inset:0;width:100%;height:100%}
.hud{position:absolute;z-index:20;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;display:flex;gap:6px;align-items:center;pointer-events:none}.pill{background:#ffffff12;border:1px solid #ffffff22;border-radius:16px;padding:8px 10px;backdrop-filter:blur(8px);font-size:13px}.hud button{pointer-events:auto;color:#fff}.icon{border:0;cursor:pointer}
#screen{position:absolute;z-index:30;inset:0;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:100%;max-width:410px;padding:26px;border:1px solid #ffffff20;border-radius:28px;background:#0a0e17eF;box-shadow:0 20px 80px #0009;text-align:center}.hidden{display:none!important}
h1{font-size:56px;line-height:.86;margin:0 0 12px;letter-spacing:-4px}h2{margin:0 0 8px}p{opacity:.72;line-height:1.45}.btn{position:relative;z-index:40;width:100%;border:0;border-radius:17px;padding:16px;margin-top:10px;font-size:17px;font-weight:850;color:#081018;background:#8df7d1;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}.btn.secondary{background:#ffffff10;color:#fff;border:1px solid #ffffff22}.tiny{font-size:12px;opacity:.5;margin-top:12px}.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice .btn{margin-top:0}.meter{height:7px;background:#ffffff10;border-radius:99px;overflow:hidden;margin:16px 0}.meter i{display:block;height:100%;width:0;background:#8df7d1}.list{text-align:left;max-height:45vh;overflow:auto;font-size:14px}.row{padding:10px 0;border-bottom:1px solid #ffffff10}
</style></head><body><main id="app"><canvas id="c"></canvas>
<div class="hud"><div class="pill">SCORE <b id="score">0</b></div><div class="pill">🪙 <b id="coins">0</b></div><div class="pill">🔥 <b id="streak">0</b></div><button class="pill icon" id="collection" type="button">◈</button></div>
<section id="screen">
<div class="card" id="menu"><h1>NEVER<br>ENDING</h1><p id="tagline">The rules change while you play.</p><div class="meter"><i id="dailyBar"></i></div><div class="tiny" id="daily"></div><button class="btn" id="start" type="button">START</button><div class="tiny">Tap anywhere to control. Discover worlds. Build your archive.</div></div>
<div class="card hidden" id="choice"><h2 id="choiceTitle"></h2><p id="choiceText"></p><div class="choice"><button class="btn" id="risk" type="button">RISK</button><button class="btn secondary" id="safe" type="button">SAFE</button></div><div class="tiny">Your choice changes the next part of the run.</div></div>
<div class="card hidden" id="archive"><h2>WORLD ARCHIVE</h2><p id="archiveStats"></p><div class="list" id="archiveList"></div><button class="btn" id="closeArchive" type="button">BACK</button></div>
<div class="card hidden" id="over"><h2 id="overTitle">RUN ENDED</h2><p>Score <b id="final">0</b> · Best <b id="best">0</b></p><p id="runSummary"></p><button class="btn" id="again" type="button">ONE MORE</button><button class="btn secondary" id="home" type="button">HOME</button></div>
</section></main>
<script>
'use strict';
const c=document.getElementById('c'),x=c.getContext('2d'),app=document.getElementById('app');
let W=0,H=0,dpr=1,raf=0,run=false,score=0,best=+(localStorage.neBest||0),coins=+(localStorage.neCoins||0),streak=+(localStorage.neStreak||0),gates=[],last=0,speed=220,nextEvent=8,choiceTrail=[],modifiers=[],unlocked=JSON.parse(localStorage.neWorlds||'[]'),secrets=JSON.parse(localStorage.neSecrets||'[]'),daily=+(localStorage.neDaily||0),todayKey=new Date().toISOString().slice(0,10),pending=null;
const player={x:0,y:0,r:16,vy:0};
const recipes={'RUSH>LOW GRAVITY>VOID':'ECLIPSE','LOW GRAVITY>RUSH>MIRROR':'DREAM','NARROW WORLD>COIN STORM>RUSH':'TREASURE','MIRROR>VOID>LOW GRAVITY':'GLASS','COIN STORM>RUSH>COIN STORM':'GOLDEN HOUR','VOID>MIRROR>RUSH':'PARADOX','ECLIPSE>DREAM>TREASURE':'INFINITE'};
const events=[
 ['LOW GRAVITY','The world becomes floaty.',()=>{player.vy*=.5}],
 ['RUSH','Everything accelerates.',()=>{speed+=65}],
 ['NARROW WORLD','Future gates become tighter.',()=>{gates.forEach(g=>g.gap=Math.max(105,g.gap-30))}],
 ['COIN STORM','A burst of coins appears.',()=>{coins+=6}],
 ['MIRROR','Your rhythm is reversed.',()=>{}],
 ['VOID','The next gate becomes harder to read.',()=>{}]
];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=app.clientWidth;H=app.clientHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function save(){localStorage.neCoins=coins;localStorage.neBest=best;localStorage.neStreak=streak;localStorage.neWorlds=JSON.stringify(unlocked);localStorage.neSecrets=JSON.stringify(secrets);localStorage.neDaily=daily}
function refreshHud(){document.getElementById('coins').textContent=coins;document.getElementById('streak').textContent=streak}
function show(id){document.querySelectorAll('.card').forEach(e=>e.classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}
function updateMenu(){if(localStorage.neDay!==todayKey){daily=0;localStorage.neDay=todayKey;save()}const pct=Math.min(100,daily/15*100);document.getElementById('dailyBar').style.width=pct+'%';document.getElementById('daily').textContent=daily>=15?'🎯 DAILY COMPLETE · +15 🪙':'🎯 DAILY: REACH 15 · '+daily+'/15';refreshHud()}
function start(){show('over');document.getElementById('over').classList.add('hidden');score=0;choiceTrail=[];modifiers=[];pending=null;speed=220;nextEvent=8;gates=[];player.x=W*.25;player.y=H*.5;player.vy=0;run=true;last=performance.now();for(let i=0;i<4;i++)addGate(W+170*i);cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function addGate(px=W+80){const gap=175+Math.random()*55;gates.push({x:px,gapY:105+Math.random()*Math.max(1,H-210),gap,passed:false})}
function flap(){if(run)player.vy=-500}
function loop(t){if(!run)return;const dt=Math.min((t-last)/1000,.033);last=t;update(dt);draw();raf=requestAnimationFrame(loop)}
function update(dt){player.vy+=1250*dt;player.y+=player.vy*dt;if(player.y<64||player.y>H-35){gameOver();return}
for(const g of gates){g.x-=speed*dt;if(!g.passed&&g.x<player.x){g.passed=true;score++;document.getElementById('score').textContent=score;if(score%5===0){coins++;refreshHud();save()}if(score>=nextEvent){nextEvent+=Math.max(7,12-Math.floor(score/20));run=false;openChoice();return}}
if(g.x+28>player.x-player.r&&g.x-28<player.x+player.r&&(player.y<g.gapY-g.gap/2||player.y>g.gapY+g.gap/2)){gameOver();return}}
if(gates.length&&gates[0].x<-70){gates.shift();addGate()}
speed+=dt*(3.5+(score/50))}
function openChoice(){let ev=null;if(secrets.includes('ECLIPSE')&&Math.random()<.08)ev=['ECLIPSE','A rare eclipse has appeared.',()=>{speed+=120}];else if(secrets.includes('DREAM')&&Math.random()<.08)ev=['DREAM','Gravity feels unreal.',()=>{player.vy*=.65}];else ev=events[Math.floor(Math.random()*events.length)];pending=ev;document.getElementById('choiceTitle').textContent=ev[0];document.getElementById('choiceText').textContent=ev[1];show('choice')}
function choose(risk){if(!pending)return;const name=pending[0];choiceTrail.push(name);if(choiceTrail.length>3)choiceTrail.shift();const key=choiceTrail.join('>');const secret=recipes[key];if(secret&&!secrets.includes(secret)){secrets.push(secret);coins+=50;document.getElementById('choiceText').textContent='🔓 SECRET WORLD: '+secret;save();refreshHud()}pending[2]();modifiers.push(name);if(risk){speed+=85;coins+=5}else{speed=Math.max(190,speed-18);coins+=2}save();refreshHud();run=true;last=performance.now();raf=requestAnimationFrame(loop)}
function gameOver(){if(!run)return;run=false;const fresh=modifiers.filter(m=>!unlocked.includes(m));if(fresh.length){fresh.forEach(m=>unlocked.push(m));coins+=fresh.length*8}if(score>best)best=score;if(score>=15&&daily<15){daily=15;coins+=15;streak++;localStorage.neDay=todayKey}if(score<15&&daily<score)daily=score;save();document.getElementById('final').textContent=score;document.getElementById('best').textContent=best;document.getElementById('runSummary').textContent=(fresh.length?'Discovered: '+fresh.join(', ')+'. ':'')+(score>=15?'Daily goal complete! ':'')+(secrets.length?'Secrets found: '+secrets.length:'');refreshHud();updateMenu();show('over')}
function draw(){x.clearRect(0,0,W,H);const hue=score>40?'rgba(255,170,80,.05)':'rgba(141,247,209,.04)';for(let i=0;i<12;i++){x.fillStyle=hue;x.beginPath();x.arc((i*97+score*4)%W,70+(i*137)%H,2+(i%3),0,Math.PI*2);x.fill()}for(const g of gates){x.fillStyle=score>40?'#ffb45e':'#8df7d1';x.fillRect(g.x-28,0,56,g.gapY-g.gap/2);x.fillRect(g.x-28,g.gapY+g.gap/2,56,H)}x.fillStyle='#fff';x.shadowBlur=18;x.shadowColor='#8df7d1';x.beginPath();x.arc(player.x,player.y,player.r,0,Math.PI*2);x.fill();x.shadowBlur=0}
function openArchive(){run=false;const all=[...unlocked.map(v=>'🌍 '+v),...secrets.map(v=>'🔐 '+v)];document.getElementById('archiveStats').textContent=unlocked.length+' worlds · '+secrets.length+' secret worlds';document.getElementById('archiveList').innerHTML=all.length?all.map(v=>'<div class="row">'+v+'</div>').join(''):'<div class="row">No discoveries yet. Survive and experiment.</div>';show('archive')}
addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;if(document.getElementById('choice').classList.contains('hidden')&&document.getElementById('archive').classList.contains('hidden')&&document.getElementById('over').classList.contains('hidden')&&document.getElementById('menu').classList.contains('hidden'))flap()});
document.getElementById('start').onclick=start;document.getElementById('again').onclick=start;document.getElementById('home').onclick=()=>{run=false;updateMenu();show('menu')};document.getElementById('risk').onclick=()=>choose(true);document.getElementById('safe').onclick=()=>choose(false);document.getElementById('collection').onclick=openArchive;document.getElementById('closeArchive').onclick=()=>{updateMenu();show('menu')};
refreshHud();updateMenu();
</script></body></html>
