<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>СДВИГ МИРА</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#080a10;color:#fff;font-family:system-ui,sans-serif}body{display:flex;justify-content:center;touch-action:manipulation}#app{width:min(100vw,520px);min-height:100dvh;padding:18px;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 0,#26324d,#0b0d14 55%)}.top{display:flex;justify-content:space-between;gap:8px}.pill{padding:9px 12px;border:1px solid #ffffff1f;border-radius:14px;background:#ffffff0b}.world{margin-top:18px;padding:24px;border-radius:28px;border:1px solid #ffffff20;background:#0b0e17cc;min-height:240px;display:flex;flex-direction:column;justify-content:center;text-align:center;box-shadow:0 20px 60px #0007}.symbol{font-size:70px;line-height:1}.name{font-size:30px;font-weight:900;margin-top:8px}.rule{opacity:.7;margin-top:8px}.meter{height:7px;background:#ffffff10;border-radius:99px;margin:18px 0;overflow:hidden}.meter i{display:block;height:100%;width:0;background:#9bf7d4}.actions{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}.btn{border:0;border-radius:18px;padding:17px;color:#071018;background:#9bf7d4;font-size:16px;font-weight:850}.btn.alt{background:#ffffff0d;color:#fff;border:1px solid #ffffff20}.hidden{display:none}.log{margin-top:14px;max-height:150px;overflow:auto;font-size:13px;opacity:.65}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(460px,100%);background:#0d111b;border:1px solid #ffffff20;border-radius:26px;padding:24px}.row{padding:10px 0;border-bottom:1px solid #ffffff10}
</style></head><body><main id="app"><div class="top"><div class="pill">🌌 ХОД <b id="turn">0</b></div><div class="pill">🧬 ЭНЕРГИЯ <b id="energy">3</b></div><button class="pill" id="archive" type="button">АРХИВ</button></div>
<section class="world"><div class="symbol" id="symbol">◇</div><div class="name" id="name">СДВИГ МИРА</div><div class="rule" id="rule">Ты управляешь не персонажем — ты управляешь правилами мира.</div><div class="meter"><i id="bar"></i></div></section>
<div class="actions" id="actions"><button class="btn" id="a1"></button><button class="btn alt" id="a2"></button><button class="btn alt" id="a3"></button></div><div class="log" id="log"></div>
<div class="modal hidden" id="modal"><div class="card"><h2>АРХИВ МИРОВ</h2><p id="stats"></p><div id="list"></div><button class="btn" id="close" type="button" onclick="document.getElementById(&quot;modal&quot;).style.display=&quot;none&quot;">НАЗАД</button></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id);let turn=+(localStorage.wsTurn||0),energy=+(localStorage.wsEnergy||3),best=+(localStorage.wsBest||0),worlds=JSON.parse(localStorage.wsWorlds||'[]'),history=[],power=1,chaos=0;
const types=[
['ЗЕРКАЛО','🪞','Каждый выбор имеет противоположный эффект.'],['МИКРОМИР','🔬','Маленькие изменения могут привести к огромным последствиям.'],['ЗАМОРОЖЕННЫЙ','❄️','Ничего не меняется, пока ты не тратишь энергию.'],['ПЕРЕВЁРНУТЫЙ','🔄','Самый безопасный на вид вариант часто оказывается опасным.'],['РОСТ','🌱','Мир постоянно меняется после каждого хода.'],['ПУСТОТА','🕳️','Некоторые решения не добавляют правила, а убирают их.'],['МЕХАНИКА','⚙️','Каждый третий ход мир меняется сам.']
];
let world=types[Math.floor(Math.random()*types.length)];
const choices=[['НАБЛЮДАТЬ',()=>{chaos=Math.max(0,chaos-1);return 'You learned something. Хаос -1.'}],['ИСКАЖАТЬ',()=>{power++;chaos++;return 'The rules bend. Сила +1, Хаос +1.'}],['РИСКНУТЬ',()=>{if(Math.random()<.5){power+=2;return 'Impossible result. Сила +2.'}chaos+=3;return 'The world rejected you. Хаос +3.'}],['ЖЕРТВА',()=>{energy=Math.max(0,energy-1);power+=3;return 'Энергия превращена в силу. +3.'}],['СБРОСИТЬ',()=>{power=1;chaos=0;return 'Мир забыл последнюю мутацию.'}],['ПОДНЯТЬСЯ',()=>{turn+=2;power+=1;return 'Ты перескочил через слой реальности. +2 хода.'}]];
function save(){localStorage.wsTurn=turn;localStorage.wsEnergy=energy;localStorage.wsBest=best;localStorage.wsWorlds=JSON.stringify(worlds);localStorage.wsLast=world[0]}
function render(){ $('turn').textContent=turn;$('energy').textContent=energy;$('name').textContent=world[0];$('symbol').textContent=world[1];$('rule').textContent=world[2]+' Сила '+power+' · Хаос '+chaos;$('bar').style.width=Math.min(100,turn/30*100)+'%';const pool=[...choices].sort(()=>Math.random()-.5).slice(0,3);pool.forEach((c,i)=>{$('a'+(i+1)).textContent=c[0];$('a'+(i+1)).onclick=()=>act(c)});save()}
function act(c){const result=c[1]();turn++;history.unshift('Turn '+turn+' · '+c[0]+': '+result);if(history.length>12)history.pop();if(turn>best)best=turn;if(!worlds.includes(world[0]))worlds.push(world[0]);if(turn%3===0){world=types[Math.floor(Math.random()*types.length)];history.unshift('🌌 СДВИГ МИРА → '+world[0])}if(chaos>=7){world=types[Math.floor(Math.random()*types.length)];chaos=1;history.unshift('⚡ МУТАЦИЯ ХАОСА → '+world[0])}if(energy===0&&turn%5===0)energy=1;$('log').innerHTML=history.map(x=>'<div class="row">'+x+'</div>').join('');render()}
function openArchive(){ $('modal').style.display='flex'; $('stats').textContent='Открыто миров: '+worlds.length+'/'+types.length+' · Лучший уровень реальности: '+best; $('list').innerHTML=worlds.map(x=>'<div class="row">🌌 '+x+'</div>').join('')||'<p>Миры пока не открыты.</p>'; $('modal').classList.remove('hidden'); } function closeArchive(){ $('modal').style.display='none'; } $('archive').addEventListener('click',openArchive); $('close').addEventListener('click',closeArchive); $('close').addEventListener('pointerup',closeArchive); $('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeArchive();}); render();
</script></main></body></html>
