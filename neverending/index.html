<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>NEVERENDING</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b12;color:#fff;font-family:system-ui,sans-serif;touch-action:none}body{display:flex;align-items:center;justify-content:center}#app{width:min(100vw,520px);height:100dvh;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 25%,#263653 0,#101522 42%,#07090f 100%)}canvas{position:absolute;inset:0;width:100%;height:100%}.hud{position:absolute;z-index:5;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;pointer-events:none}.pill{background:#ffffff12;border:1px solid #ffffff20;border-radius:18px;padding:8px 12px;backdrop-filter:blur(8px)}#screen{position:absolute;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;padding:28px}.card{width:100%;max-width:400px;padding:28px;border:1px solid #ffffff20;border-radius:28px;background:#0b0f19dd;box-shadow:0 20px 80px #0008;text-align:center}.hidden{display:none!important}h1{font-size:54px;line-height:.9;margin:0 0 12px;letter-spacing:-3px}p{opacity:.72;line-height:1.5}.btn{width:100%;border:0;border-radius:18px;padding:16px;margin-top:10px;font-size:17px;font-weight:800;color:#081018;background:#8df7d1;touch-action:manipulation}.btn.secondary{background:#ffffff12;color:#fff;border:1px solid #ffffff20}.tiny{font-size:12px;opacity:.5;margin-top:14px}.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice .btn{margin-top:0}
</style></head><body><main id="app"><canvas id="c"></canvas><div class="hud"><div class="pill">SCORE <b id="score">0</b></div><div class="pill">🪙 <b id="coins">0</b></div><div class="pill" id="streak">🔥 0</div><button class="pill" id="collection" type="button">◈</button></div><section id="screen"><div class="card" id="menu"><h1>NEVER<br>ENDING</h1><p>The rules change while you play.</p><div class="tiny" id="daily"></div><button class="btn" id="start">START</button><div class="tiny">Every run is different.</div></div><div class="card hidden" id="choice"><h2 id="choiceTitle">THE WORLD CHANGED</h2><p id="choiceText"></p><div class="choice"><button class="btn" id="risk">RISK</button><button class="btn secondary" id="safe">SAFE</button></div></div><div class="card hidden" id="collectionPanel"><h2>WORLD ARCHIVE</h2><p id="archiveText"></p><button class="btn" id="closeArchive">BACK</button></div><div class="card hidden" id="over"><h2>RUN ENDED</h2><p>Score: <b id="final">0</b></p><button class="btn" id="again">ONE MORE</button><button class="btn secondary" id="home">HOME</button></div></section></main><script>
const c=document.getElementById('c'),x=c.getContext('2d'),app=document.getElementById('app');let W,H,dpr,raf,run=false,score=0,coins=+(localStorage.neCoins||0),streak=+(localStorage.neStreak||0),modifiers=[],unlocked=JSON.parse(localStorage.neWorlds||'[]'),player={x:0,y:0,r:16,vy:0},gates=[],last=0,speed=220,nextEvent=12,mode=0;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=app.clientWidth;H=app.clientHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();document.getElementById('coins').textContent=coins;document.getElementById('streak').textContent='🔥 '+streak;const today=new Date().toISOString().slice(0,10),lastDay=localStorage.neLastDay||'';document.getElementById('daily').textContent=lastDay===today?'DAILY RUN COMPLETE':'🎯 DAILY: REACH 15 SCORE';
function show(id){for(const e of document.querySelectorAll('.card'))e.classList.add('hidden');document.getElementById(id).classList.remove('hidden')}
function start(){show('over');modifiers=[];document.getElementById('streak').textContent='🔥 '+streak;document.getElementById('over').classList.add('hidden');score=0;gates=[];speed=220;nextEvent=12;player={x:W*.25,y:H*.5,r:16,vy:0};run=true;last=performance.now();for(let i=0;i<4;i++)addGate(W+180*i);raf=requestAnimationFrame(loop)}
function addGate(px=W+80){let gap=170+Math.random()*55;gates.push({x:px,gapY:110+Math.random()*(H-220),gap,passed:false})}
function flap(){if(!run)return;player.vy=-500}
function loop(t){if(!run)return;let dt=Math.min((t-last)/1000,.033);last=t;update(dt);draw();raf=requestAnimationFrame(loop)}
function update(dt){player.vy+=1250*dt;player.y+=player.vy*dt;if(player.y<65||player.y>H-40)return gameOver();for(const g of gates){g.x-=speed*dt;if(!g.passed&&g.x<player.x){g.passed=true;score++;document.getElementById('score').textContent=score;if(score%5===0){coins++;localStorage.neCoins=coins;document.getElementById('coins').textContent=coins}if(score>=nextEvent){nextEvent+=12;run=false;choice();return}}if(g.x+28>player.x-player.r&&g.x-28<player.x+player.r&&(player.y<g.gapY-g.gap/2||player.y>g.gapY+g.gap/2))return gameOver()}if(gates.length&&gates[0].x<-60){gates.shift();addGate()}speed+=dt*4}
function choice(){const events=[['LOW GRAVITY','Jumps become floatier.',()=>{player.vy*=.45}],['RUSH','Everything gets faster.',()=>{speed+=80}],['NARROW WORLD','Gates become tighter.',()=>{for(const g of gates)g.gap=Math.max(110,g.gap-35)}],['COIN STORM','The next three gates pay double.',()=>{coins+=6}]];const e=events[Math.floor(Math.random()*events.length)];document.getElementById('choiceTitle').textContent=e[0];document.getElementById('choiceText').textContent=e[1];window.pendingEvent=e;show('choice')}
function choose(risk){mode=risk?1:0;if(window.pendingEvent){window.pendingEvent[2]();modifiers.push(window.pendingEvent[0])}if(risk){speed+=90;coins+=5}else{speed=Math.max(190,speed-20);coins+=2}localStorage.neCoins=coins;document.getElementById('coins').textContent=coins;run=true;last=performance.now();raf=requestAnimationFrame(loop)}
function gameOver(){run=false;for(const m of modifiers){if(!unlocked.includes(m)){unlocked.push(m);localStorage.neWorlds=JSON.stringify(unlocked);coins+=8}}if(score>=15){streak++;localStorage.neStreak=streak;localStorage.neLastDay=new Date().toISOString().slice(0,10);coins+=15;localStorage.neCoins=coins;document.getElementById('coins').textContent=coins;document.getElementById('streak').textContent='🔥 '+streak} document.getElementById('final').textContent=score;show('over')}
function draw(){x.clearRect(0,0,W,H);for(let i=0;i<8;i++){x.fillStyle='rgba(141,247,209,.04)';x.beginPath();x.arc((i*97+score*3)%W,100+(i*137)%H,2,0,7);x.fill()}for(const g of gates){x.fillStyle='#8df7d1';x.fillRect(g.x-28,0,56,g.gapY-g.gap/2);x.fillRect(g.x-28,g.gapY+g.gap/2,56,H)}x.fillStyle='#fff';x.beginPath();x.arc(player.x,player.y,player.r,0,7);x.fill()}
addEventListener('pointerdown',e=>{if(e.target.tagName==='BUTTON')return;if(document.getElementById('menu').classList.contains('hidden')&&document.getElementById('choice').classList.contains('hidden')&&document.getElementById('over').classList.contains('hidden'))flap()});
document.getElementById('collection').onclick=()=>{run=false;document.getElementById('archiveText').textContent=unlocked.length?('Discovered: '+unlocked.join(' · ')):'No worlds discovered yet. Survive long enough to discover them.';show('collectionPanel')};document.getElementById('closeArchive').onclick=()=>show('menu');document.getElementById('start').onclick=start;document.getElementById('again').onclick=start;document.getElementById('home').onclick=()=>{run=false;show('menu')};document.getElementById('risk').onclick=()=>choose(true);document.getElementById('safe').onclick=()=>choose(false);
</script></body></html>
