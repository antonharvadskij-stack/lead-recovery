<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Последний остров — v0.2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07111d;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:14px;gap:8px}.pill{pointer-events:auto;background:#07111dcc;border:1px solid #ffffff22;border-radius:16px;padding:9px 12px;font-weight:800;backdrop-filter:blur(8px)}#event{position:absolute;top:75px;left:50%;transform:translateX(-50%);background:#ffd45a;color:#10151c;padding:9px 15px;border-radius:18px;font-weight:900;display:none}
#controls{position:absolute;bottom:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:end}.joystick{width:118px;height:118px;border-radius:50%;background:#ffffff14;border:1px solid #ffffff25;pointer-events:auto;position:relative}.stick{width:48px;height:48px;border-radius:50%;background:#ffffff55;position:absolute;left:35px;top:35px}.buttons{display:flex;gap:9px;pointer-events:auto}.action{width:72px;height:72px;border:0;border-radius:20px;background:#ffd45a;color:#111;font-size:12px;font-weight:900;box-shadow:0 5px 0 #0004}.action.dark{background:#ffffffdd}.hint{position:absolute;bottom:145px;left:50%;transform:translateX(-50%);background:#07111dcc;border-radius:14px;padding:8px 12px;font-size:12px;white-space:nowrap;opacity:.85}
#panel{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(430px,calc(100% - 24px));background:#0b1420f2;border:1px solid #ffffff1c;border-radius:24px;padding:16px;display:none;pointer-events:auto;box-shadow:0 20px 60px #0008}.panelrow{display:flex;justify-content:space-between;margin:7px 0}.btn{width:100%;border:0;border-radius:15px;padding:13px;background:#ffd45a;font-weight:900;margin-top:8px}.close{background:#ffffff12;color:#fff}
</style></head><body>
<div id="game"></div><div id="hud"><div class="top"><div class="pill">🪵 <span id="wood">20</span></div><div class="pill">🪙 <span id="coins">100</span></div><div class="pill">❤️ <span id="hp">100</span></div><button class="pill" id="menu">☰</button></div><div id="event"></div><div class="hint" id="hint">Собери дерево и построй убежище</div>
<div id="controls"><div class="joystick" id="joy"><div class="stick" id="stick"></div></div><div class="buttons"><button class="action" id="collect">🪓<br>СОБРАТЬ</button><button class="action dark" id="build">🏠<br>СТРОИТЬ</button></div></div></div>
<div id="panel"><h2 style="margin:0 0 10px">ПОСЛЕДНИЙ ОСТРОВ</h2><div class="panelrow"><span>День</span><b id="day">1</b></div><div class="panelrow"><span>Дерево</span><b id="pwood"></b></div><div class="panelrow"><span>Монеты</span><b id="pcoins"></b></div><div class="panelrow"><span>Построено</span><b id="built"></b></div><button class="btn close" id="close">Продолжить</button></div>
<script>
(()=>{const $=id=>document.getElementById(id);let s=JSON.parse(localStorage.island3d||'null')||{wood:20,coins:100,hp:100,built:0,day:1};const cvs=document.createElement('canvas');cvs.id='world';$('game').appendChild(cvs);const x=cvs.getContext('2d');let W,H,px=0,pz=0,move={x:0,z:0};function size(){W=cvs.width=innerWidth*devicePixelRatio;H=cvs.height=innerHeight*devicePixelRatio;cvs.style.width='100%';cvs.style.height='100%';x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight}addEventListener('resize',size);size();
const trees=[];for(let i=0;i<12;i++){let a=Math.random()*6.28,r=110+Math.random()*170;trees.push({x:Math.cos(a)*r,z:Math.sin(a)*r,h:1})}let house=s.built;function iso(wx,wz){let scale=Math.min(W,H)/720;return{x:W/2+(wx-wz)*.78*scale+px,y:H/2+(wx+wz)*.39*scale+60}}function poly(points,fill,stroke){x.beginPath();points.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.closePath();x.fillStyle=fill;x.fill();if(stroke){x.strokeStyle=stroke;x.stroke()}}
function circle(p,r,fill){x.beginPath();x.arc(p.x,p.y,r,0,Math.PI*2);x.fillStyle=fill;x.fill()}function tree(t){let p=iso(t.x,t.z),sc=Math.min(W,H)/720;x.fillStyle='#70452a';x.fillRect(p.x-5*sc,p.y-42*sc,10*sc,45*sc);circle({x:p.x,y:p.y-55*sc},28*sc,'#287d3d');circle({x:p.x-18*sc,y:p.y-47*sc},20*sc,'#32934b');circle({x:p.x+17*sc,y:p.y-46*sc},20*sc,'#246f39')}
function draw(){x.clearRect(0,0,W,H);let sc=Math.min(W,H)/720; // sky/water
x.fillStyle='#73cbe7';x.fillRect(0,0,W,H);circle({x:W/2,y:H/2+75*sc},310*sc,'#3aa8cf');circle({x:W/2+25*sc,y:H/2+58*sc},270*sc,'#58b7d1');
// island shadow + body
let c=iso(0,0);poly([{x:c.x-245*sc,y:c.y+20*sc},{x:c.x-125*sc,y:c.y-125*sc},{x:c.x+85*sc,y:c.y-140*sc},{x:c.x+245*sc,y:c.y-15*sc},{x:c.x+150*sc,y:c.y+135*sc},{x:c.x-70*sc,y:c.y+165*sc},{x:c.x-245*sc,y:c.y+20*sc}], '#d2bd70');
poly([{x:c.x-225*sc,y:c.y+5*sc},{x:c.x-110*sc,y:c.y-115*sc},{x:c.x+80*sc,y:c.y-130*sc},{x:c.x+225*sc,y:c.y-10*sc},{x:c.x+135*sc,y:c.y+110*sc},{x:c.x-60*sc,y:c.y+140*sc}], '#66ad4e');
trees.forEach(tree);if(house){let p=iso(0,-80);poly([{x:p.x-45*sc,y:p.y},{x:p.x+45*sc,y:p.y-22*sc},{x:p.x+45*sc,y:p.y+65*sc},{x:p.x-45*sc,y:p.y+87*sc}],'#9a643c');poly([{x:p.x-55*sc,y:p.y},{x:p.x,y:p.y-45*sc},{x:p.x+55*sc,y:p.y}],'#a83333');}
let p=iso(px,pz);circle({x:p.x,y:p.y-38*sc},15*sc,'#f4c39a');poly([{x:p.x-17*sc,y:p.y-25*sc},{x:p.x+17*sc,y:p.y-25*sc},{x:p.x+13*sc,y:p.y+15*sc},{x:p.x-13*sc,y:p.y+15*sc}],'#f0c84b');circle({x:p.x,y:p.y-58*sc},17*sc,'#e8bd91');circle({x:p.x,y:p.y-70*sc},17*sc,'#5b3b25');}
function render(){ $('wood').textContent=s.wood;$('coins').textContent=s.coins;$('hp').textContent=s.hp;$('day').textContent=s.day;$('pwood').textContent=s.wood;$('pcoins').textContent=s.coins;$('built').textContent=s.built?'Да':'Нет';draw()}
function save(){localStorage.island3d=JSON.stringify(s)}
function collect(){if(s.wood>=99){$('hint').textContent='Рюкзак полон';return}s.wood+=5;$('hint').textContent=Math.random()<.25?'Нашёл дерево и монеты! 🪙':'Дерево +5 🪵';if(Math.random()<.25)s.coins+=10;render();save()}
function build(){if(s.built){$('hint').textContent='Убежище уже построено';return}if(s.wood<30){$('hint').textContent='Нужно 30 дерева';return}s.wood-=30;s.built=1;house=1;$('hint').textContent='🏠 Убежище построено!';render();save()}
function event(){let n=Math.floor(Math.random()*4);if(n===0){s.coins+=50;$('event').textContent='☄️ Метеорит! +50 🪙'}if(n===1){s.hp=Math.max(10,s.hp-25);$('event').textContent='🌊 Большая волна! −25 ❤️'}if(n===2){s.wood+=15;$('event').textContent='🌪️ Шторм! +15 🪵'}if(n===3){s.coins+=100;$('event').textContent='💎 Найден сундук! +100 🪙'}$('event').style.display='block';setTimeout(()=>{$('event').style.display='none'},2500);s.day++;render();save()}
function loop(){px+=move.x*2.8;pz+=move.z*2.8;let d=Math.hypot(px,pz);if(d>150){px*=150/d;pz*=150/d}render();requestAnimationFrame(loop)}
function joyStart(e){e.preventDefault();let q=e.touches?e.touches[0]:e;moveJoy(q.clientX,q.clientY);document.onmousemove=q=>moveJoy(q.clientX,q.clientY);document.ontouchmove=q=>{q.preventDefault();moveJoy(q.touches[0].clientX,q.touches[0].clientY)};document.onmouseup=joyEnd;document.ontouchend=joyEnd}function moveJoy(a,b){let r=$('joy').getBoundingClientRect(),dx=a-r.left-r.width/2,dy=b-r.top-r.height/2,m=Math.min(38,Math.hypot(dx,dy)),ang=Math.atan2(dy,dx);$('stick').style.transform='translate('+Math.cos(ang)*m+'px,'+Math.sin(ang)*m+'px)';move={x:Math.cos(ang)*m/38,z:Math.sin(ang)*m/38}}function joyEnd(){move={x:0,z:0};$('stick').style.transform='';document.onmousemove=null;document.ontouchmove=null}
$('joy').ontouchstart=joyStart;$('joy').onmousedown=joyStart;$('collect').onclick=collect;$('build').onclick=build;$('menu').onclick=()=>{$('panel').style.display='block'};$('close').onclick=()=>{$('panel').style.display='none'};setInterval(event,45000);setInterval(()=>{if(s.built)s.coins+=10;save();render()},60000);render();requestAnimationFrame(loop)})();
</script></body></script></body></html>
