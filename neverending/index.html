<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#07131f"><title>Последний остров</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#06111d;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;touch-action:none}#game,canvas{position:fixed;inset:0;width:100%;height:100%}#hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;gap:8px;padding:10px;align-items:center}.pill{pointer-events:auto;background:linear-gradient(180deg,#14283bdd,#081521e8);border:1px solid #ffffff20;border-radius:16px;padding:9px 12px;font-weight:900;box-shadow:0 8px 24px #0006,inset 0 1px #ffffff12;backdrop-filter:blur(10px)}.menu{margin-left:auto}.stats{position:absolute;top:64px;left:10px;width:145px;background:linear-gradient(180deg,#102335e8,#07131de8);border:1px solid #ffffff18;border-radius:16px;padding:9px;font-size:12px;box-shadow:0 12px 35px #0007;backdrop-filter:blur(9px)}.bar{height:8px;background:#020810aa;border:1px solid #ffffff10;border-radius:8px;margin:3px 0 6px;overflow:hidden}.fill{height:100%;border-radius:8px;box-shadow:0 0 9px currentColor}.hp{background:#ff5d67}.en{background:#ffd34f}.hu{background:#72e09b}#mission,#toast{position:absolute;left:50%;transform:translateX(-50%);background:#07131ed9;border-radius:16px;padding:8px 13px;font-weight:800;font-size:12px;text-align:center}#mission{top:12px;max-width:50vw;border:1px solid #ffffff18;box-shadow:0 10px 30px #0006;backdrop-filter:blur(10px)}#toast{top:105px;background:#ffd45a;color:#111;display:none}.controls{position:absolute;bottom:13px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:end}.joy{width:126px;height:126px;border-radius:50%;background:radial-gradient(circle,#203449aa 0 34%,#0b1a28aa 35% 100%);border:1px solid #ffffff28;pointer-events:auto;position:relative;box-shadow:inset 0 0 30px #0008,0 10px 30px #0008}.stick{width:52px;height:52px;border-radius:50%;background:linear-gradient(145deg,#dff7ffcc,#8ca9bb99);border:1px solid #fff8;position:absolute;left:36px;top:36px;box-shadow:0 5px 15px #0008}.buttons{display:flex;gap:7px;pointer-events:auto}.act{width:74px;height:74px;border:1px solid #ffffff30;border-radius:22px;background:linear-gradient(145deg,#ffe37a,#ffbd38);font-weight:950;box-shadow:0 10px 25px #0008,inset 0 2px #fff8;transition:transform .08s,filter .08s}.act:active{transform:scale(.94);filter:brightness(1.12)}.blue{background:#80dcff}.white{background:#f4f5f5}.panel{position:fixed;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);width:min(430px,calc(100% - 24px));background:#0b1724f5;border:1px solid #ffffff22;border-radius:24px;padding:18px;display:none;pointer-events:auto;box-shadow:0 25px 80px #000b}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #ffffff10}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.btn{border:0;border-radius:14px;padding:12px;background:#ffd45a;font-weight:900}.dark{background:#ffffff14;color:#fff}.night{z-index:3;position:fixed;inset:0;background:radial-gradient(circle at 75% 18%,#ffffff22 0 2px,transparent 3px),linear-gradient(#08152599,#08152599);pointer-events:none;opacity:0;transition:opacity .8s}.xpbar{position:absolute;top:91px;left:10px;width:135px;height:4px;background:#ffffff18;border-radius:9px;overflow:hidden}.xpf{height:100%;width:0;background:#b88cff}.danger{animation:shake .22s linear 2}@keyframes shake{25%{transform:translateX(4px)}50%{transform:translateX(-4px)}75%{transform:translateX(3px)}}.reward{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.7);font-size:28px;font-weight:1000;opacity:0;pointer-events:none;text-shadow:0 4px 20px #000;transition:.25s}.reward.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.buildmenu{position:absolute;bottom:95px;right:14px;display:none;gap:7px;flex-direction:column;pointer-events:auto}.buildmenu button{border:0;border-radius:14px;padding:11px 13px;font-weight:900}.buildmenu .b1{background:#ff9e55}.buildmenu .b2{background:#b9a7ff}.mini{margin-top:5px;width:115px;height:55px;border:1px solid #ffffff18;border-radius:10px;background:#07131d88;position:relative;overflow:hidden}.event{box-shadow:0 12px 30px #0008;backdrop-filter:blur(10px);position:absolute;left:50%;top:145px;transform:translateX(-50%);background:#7b1e2b;color:#fff;border:1px solid #ffb0b8;border-radius:14px;padding:8px 13px;font-weight:1000;display:none;z-index:5}.boss{filter:drop-shadow(0 0 10px #ff3344)}.mini:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#ffd45a;left:54px;top:24px;box-shadow:0 0 0 3px #ffd45a33}</style></head><body><div id="game"></div><div class="night" id="night"></div><div class="reward" id="reward"></div><div id="hud"><div class="top"><div class="pill">🪵 <b id="wood">30</b></div><div class="pill">🪨 <b id="stone">10</b></div><div class="pill">🪙 <b id="coins">100</b></div><button class="pill menu" id="menu">☰</button></div><div id="mission">🎯 Соберите 10 дерева</div><div class="xpbar"><div class="xpf" id="xpf"></div></div><div class="stats">❤️ <b id="hp">100</b><div class="bar"><div id="hb" class="fill hp"></div></div>⚡ <b id="en">100</b><div class="bar"><div id="eb" class="fill en"></div></div>🍖 <b id="hu">100</b><div class="bar"><div id="ub" class="fill hu"></div></div><small>Уровень <b id="lvl">1</b> · День <b id="day">1</b> · ⚔️ <b id="wpn">1</b></small><div class="mini" id="mini"></div></div><div id="toast"></div><div class="event" id="event"></div><div class="controls"><div class="joy" id="joy"><div class="stick" id="stick"></div></div><div class="buttons"><button class="act" id="collect">🪓<br>СОБРАТЬ</button><button class="act blue" id="loot">🎁<br>ЛУТ</button><button class="act" style="background:#ff806e" id="fight">⚔️<br>АТАКА</button><button class="act white" id="build">🏠<br>СТРОИТЬ</button></div></div><div class="buildmenu" id="buildmenu"><button class="b1" id="fire">🔥 КОСТЁР · 10🪵</button><button class="b2" id="tower">🗼 ВЫШКА · 25🪵 20🪨</button></div></div><div class="panel" id="panel"><h2>🏝️ ПОСЛЕДНИЙ ОСТРОВ</h2><p>Выживай, строй и открывай новые части острова.</p><div class="row"><span>День</span><b id="pday">1</b></div><div class="row"><span>Уровень</span><b id="plvl">1</b></div><div class="row"><span>Ресурсы</span><b><span id="pwood">30</span>🪵 / <span id="pstone">10</span>🪨</b></div><div class="row"><span>Монеты</span><b id="pcoins">100</b></div><div class="row"><span>Построек</span><b id="pbuild">0</b></div><div class="row"><span>Побеждено</span><b id="pkills">0</b></div><div class="row"><span>Боссы</span><b id="pboss">0</b></div><div class="row"><span>Редкие предметы</span><b id="prare">0</b></div><div class="grid"><button class="btn" id="up">⬆️ УЛУЧШИТЬ</button><button class="btn" id="weapon">⚔️ ОРУЖИЕ</button><button class="btn" id="skill">✨ НАВЫК</button><button class="btn dark" id="new">↻ НОВАЯ ИГРА</button><button class="btn dark" id="food">🍖 ЕСТЬ</button></div><button class="btn dark" id="close" style="width:100%;margin-top:8px">ПРОДОЛЖИТЬ</button></div><script>
(()=>{const $=i=>document.getElementById(i),D={wood:30,stone:10,coins:100,hp:100,en:100,hu:100,day:1,lvl:1,xp:0,built:0};let s={...D,combo:0,kills:0,weapon:1,skills:0,bosses:0,rare:0,crit:0};try{let q=JSON.parse(localStorage.lastIsland||'null');if(q)s={...D,...q}}catch(e){}const c=document.createElement('canvas'),g=c.getContext('2d');$('game').appendChild(c);const worldArt=new Image();worldArt.src='./assets/island-world.svg';let W,H,d=1,px=0,pz=0,m={x:0,z:0},last=performance.now(),timer=0,flash=0,comboTimer=0,eventTimer=0,eventHide=null,bossSpawnedDay=0;const N=[];const B=[];const E=[];const C=[];const zones=[{x:-260,z:-210,name:'ТЁМНЫЙ ЛЕС'},{x:270,z:-160,name:'КАМЕННЫЙ БЕРЕГ'},{x:230,z:240,name:'ЗАБЫТЫЕ РУИНЫ'}];for(let i=0;i<26;i++){let a=Math.random()*6.28,r=80+Math.random()*250;N.push({x:Math.cos(a)*r,z:Math.sin(a)*r,t:Math.random()<.72?'tree':'rock',a:1})}for(let i=0;i<3;i++){let a=Math.random()*6.28,r=120+Math.random()*120;E.push({x:Math.cos(a)*r,z:Math.sin(a)*r,h:3,t:0,boss:false})}for(let i=0;i<6;i++){let a=Math.random()*6.28,r=140+Math.random()*330;C.push({x:Math.cos(a)*r,z:Math.sin(a)*r,open:false,rare:Math.random()<.18})}function sz(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',sz);sz();function save(){localStorage.lastIsland=JSON.stringify(s)}function reward(t){$('reward').textContent=t;$('reward').classList.add('show');setTimeout(()=>$('reward').classList.remove('show'),700)}function msg(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>$('toast').style.display='none',1800)}function iso(x,z){let q=Math.min(W,H)/700;return{x:W/2+(x-z)*.78*q-px*.35,y:H/2+(x+z)*.39*q-pz*.18+35}}function poly(a,f){g.beginPath();a.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.closePath();g.fillStyle=f;g.fill()}function cir(p,r,f){g.beginPath();g.arc(p.x,p.y,r,0,7);g.fillStyle=f;g.fill()}function draw(){
g.clearRect(0,0,W,H);
let q=Math.min(W,H)/700;
const sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#071a2c');sky.addColorStop(.55,'#0b2b3a');sky.addColorStop(1,'#06121f');g.fillStyle=sky;g.fillRect(0,0,W,H);

// animated water
const t=performance.now()/1000;
for(let i=0;i<34;i++){let x=((i*97+t*12)% (W+180))-90,y=((i*53+t*7)%H);g.strokeStyle='rgba(102,224,239,.12)';g.lineWidth=1.5;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+18,y-3,x+36,y);g.stroke()}
if(worldArt.complete&&worldArt.naturalWidth){g.save();g.globalAlpha=.98;g.drawImage(worldArt,-px*.035,-pz*.02,W+px*.07,H+pz*.04);g.restore()}else{const sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#071a2c');sky.addColorStop(.55,'#0b2b3a');sky.addColorStop(1,'#06121f');g.fillStyle=sky;g.fillRect(0,0,W,H)}
// animated atmospheric particles and water highlights
for(let i=0;i<28;i++){let x=((i*113+t*9)%(W+120))-60,y=((i*71+t*4)%H);g.strokeStyle='rgba(190,242,255,.16)';g.lineWidth=1.2;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+16,y-3,x+32,y);g.stroke()}
g.fillStyle='rgba(255,245,200,.035)';g.fillRect(0,0,W,H);
// zones
zones.forEach(z=>{let p=iso(z.x,z.z);cir({x:p.x,y:p.y},82*q,'rgba(255,255,255,.025)');g.font='800 '+Math.max(9,11*q)+'px system-ui';g.fillStyle='rgba(255,255,255,.35)';g.textAlign='center';g.fillText(z.name,p.x,p.y+88*q)});

// resources
N.filter(n=>n.a).sort((a,b)=>a.x+a.z-b.x-b.z).forEach(n=>{
 let p=iso(n.x,n.z);
 g.save();g.shadowColor='#0008';g.shadowBlur=10;
 if(n.t==='tree'){
   g.fillStyle='#6a3e26';g.fillRect(p.x-5*q,p.y-34*q,10*q,36*q);
   g.fillStyle='#3b2419';g.fillRect(p.x-2*q,p.y-34*q,4*q,36*q);
   cir({x:p.x,y:p.y-57*q},25*q,'#14552e');cir({x:p.x-17*q,y:p.y-49*q},20*q,'#1d7138');cir({x:p.x+15*q,y:p.y-48*q},18*q,'#2a8644');cir({x:p.x,y:p.y-69*q},17*q,'#3aa052');
 }else{
   poly([{x:p.x-21*q,y:p.y},{x:p.x-12*q,y:p.y-19*q},{x:p.x+8*q,y:p.y-25*q},{x:p.x+21*q,y:p.y-7*q},{x:p.x+11*q,y:p.y+7*q},{x:p.x-15*q,y:p.y+7*q}],'#667784');
   poly([{x:p.x-8*q,y:p.y-18*q},{x:p.x+7*q,y:p.y-22*q},{x:p.x+14*q,y:p.y-9*q},{x:p.x,y:p.y-8*q}],'#a8b6bd');
 }
 g.restore();
});

// buildings
B.sort((a,b)=>a.x+a.z-b.x-b.z).forEach(b=>{
 let p=iso(b.x,b.z);
 if(b.t==='house'){
   g.save();g.shadowColor='#0009';g.shadowBlur=16;
   poly([{x:p.x-38*q,y:p.y},{x:p.x+38*q,y:p.y-18*q},{x:p.x+38*q,y:p.y+43*q},{x:p.x-38*q,y:p.y+61*q}],'#8b5a3b');
   poly([{x:p.x-44*q,y:p.y},{x:p.x,y:p.y-40*q},{x:p.x+44*q,y:p.y}],'#a9473e');
   poly([{x:p.x-35*q,y:p.y-2*q},{x:p.x,y:p.y-33*q},{x:p.x+35*q,y:p.y-3*q}],'#d46a48');
   g.fillStyle='#3b241d';g.fillRect(p.x-7*q,p.y+17*q,14*q,27*q);
   g.fillStyle='#ffd75a';g.fillRect(p.x+15*q,p.y+10*q,11*q,10*q);g.restore();
 }else if(b.t==='tower'){
   g.save();g.shadowColor='#0009';g.shadowBlur=15;g.fillStyle='#573a6e';g.fillRect(p.x-8*q,p.y-55*q,16*q,62*q);
   g.fillStyle='#9c6dbe';g.fillRect(p.x-24*q,p.y-64*q,48*q,13*q);g.fillStyle='#f6cf5c';g.fillRect(p.x-3*q,p.y-48*q,6*q,12*q);g.restore();
 }else{
   cir({x:p.x,y:p.y+2*q},18*q,'#65311f');cir({x:p.x,y:p.y-18*q},12*q,'#ff8b24');cir({x:p.x-5*q,y:p.y-22*q},7*q,'#ffe66b');
 }
});

// chests
C.forEach(ch=>{if(ch.open)return;let p=iso(ch.x,ch.z);g.save();g.shadowColor=ch.rare?'#a85cff':'#000';g.shadowBlur=ch.rare?20:10;poly([{x:p.x-15*q,y:p.y},{x:p.x+15*q,y:p.y-8*q},{x:p.x+15*q,y:p.y+8*q},{x:p.x-15*q,y:p.y+16*q}],ch.rare?'#6d35aa':'#7b4a25');g.fillStyle=ch.rare?'#d9a4ff':'#e2b24e';g.fillRect(p.x-3*q,p.y-5*q,6*q,9*q);g.restore()});

// enemies
E.forEach(e=>{if(e.h<1)return;let p=iso(e.x,e.z);g.save();g.shadowColor=e.boss?'#ff244488':'#0009';g.shadowBlur=e.boss?25:12;
if(e.boss){cir({x:p.x,y:p.y-20*q},29*q,'#3b1322');cir({x:p.x,y:p.y-25*q},23*q,'#a62c43');poly([{x:p.x-18*q,y:p.y-37*q},{x:p.x-9*q,y:p.y-53*q},{x:p.x-2*q,y:p.y-39*q},{x:p.x+10*q,y:p.y-55*q},{x:p.x+19*q,y:p.y-36*q}],'#d2b36a');cir({x:p.x-8*q,y:p.y-27*q},3*q,'#ffe06a');cir({x:p.x+8*q,y:p.y-27*q},3*q,'#ffe06a');g.fillStyle='#32101a';g.fillRect(p.x-35*q,p.y-62*q,70*q,6*q);g.fillStyle='#ff4055';g.fillRect(p.x-35*q,p.y-62*q,70*q*Math.max(0,e.h/e.max),6*q)}
else{cir({x:p.x,y:p.y-13*q},16*q,'#54252d');cir({x:p.x,y:p.y-30*q},11*q,'#a85a45');g.fillStyle='#e8c66a';g.fillRect(p.x-8*q,p.y-34*q,16*q,4*q);g.fillStyle='#fff';g.fillRect(p.x-6*q,p.y-29*q,3*q,3*q);g.fillRect(p.x+3*q,p.y-29*q,3*q,3*q)}
g.restore()});

// player
let pp=iso(px,pz);g.save();g.shadowColor='#000b';g.shadowBlur=18;cir({x:pp.x,y:pp.y+8*q},17*q,'rgba(0,0,0,.45)');cir({x:pp.x,y:pp.y-36*q},14*q,'#e0a47b');poly([{x:pp.x-17*q,y:pp.y-23*q},{x:pp.x+17*q,y:pp.y-23*q},{x:pp.x+12*q,y:pp.y+12*q},{x:pp.x-12*q,y:pp.y+12*q}],'#2f77c9');g.fillStyle='#24344d';g.fillRect(pp.x-13*q,pp.y-48*q,26*q,8*q);g.fillStyle='#fff';g.fillRect(pp.x+12*q,pp.y-10*q,17*q,3*q);g.restore();
g.strokeStyle='#8dffd1';g.lineWidth=2;g.beginPath();g.arc(pp.x,pp.y+14*q,22*q,0,Math.PI*2);g.stroke();

if(flash>0){g.fillStyle='rgba(255,255,255,'+flash+')';g.fillRect(0,0,W,H)}
$('night').style.opacity=(s.day%3===0&&timer>42)?'.42':'0';
let mp=$('mini');if(mp){let dots='';C.filter(x=>!x.open).forEach(ch=>{let x=57+(ch.x-px)/8,y=27+(ch.z-pz)/8;dots+=`<i style="position:absolute;width:5px;height:5px;border-radius:50%;background:${ch.rare?'#d58cff':'#ffd45a'};left:${x}px;top:${y}px"></i>`});E.filter(x=>x.h>0).forEach(e=>{let x=57+(e.x-px)/8,y=27+(e.z-pz)/8;dots+=`<i style="position:absolute;width:5px;height:5px;border-radius:50%;background:#ff5368;left:${x}px;top:${y}px"></i>`});mp.innerHTML=dots}
}function ui(){$('wood').textContent=s.wood;$('stone').textContent=s.stone;$('coins').textContent=s.coins;$('hp').textContent=Math.round(s.hp);$('en').textContent=Math.round(s.en);$('hu').textContent=Math.round(s.hu);$('hb').style.width=s.hp+'%';$('eb').style.width=s.en+'%';$('ub').style.width=s.hu+'%';$('lvl').textContent=s.lvl;$('day').textContent=s.day;$('pday').textContent=s.day;$('plvl').textContent=s.lvl;$('pwood').textContent=s.wood;$('pstone').textContent=s.stone;$('pcoins').textContent=s.coins;$('pbuild').textContent=s.built;$('pkills').textContent=s.kills;$('pboss').textContent=s.bosses;$('prare').textContent=s.rare;$('wpn').textContent=s.weapon;$('xpf').style.width=Math.min(100,s.xp/(s.lvl*40)*100)+'%';let target=s.day>=5&&s.bosses<1?'👑 Найдите и победите БОССА':s.day<3?'Соберите '+(20+s.day*5)+' дерева':s.kills<3?'Победите '+(3-s.kills)+' врагов':s.built<3?'Постройте ещё '+(3-s.built)+' объекта':'Исследуйте остров и ищите сундуки';$('mission').textContent='🎯 '+target;draw()}function nearest(){let z=null,b=999;N.forEach(n=>{if(n.a){let q=Math.hypot(n.x-px,n.z-pz);if(q<b){b=q;z=n}}});return z}function collect(){if(s.en<8)return msg('⚡ Нужна энергия');let n=nearest();if(!n||Math.hypot(n.x-px,n.z-pz)>70)return msg('Подойдите ближе');s.en-=8;n.a=0;if(n.t==='tree'){s.wood+=5+Math.floor(Math.random()*5);msg('🪵 + дерево')}else{s.stone+=3+Math.floor(Math.random()*3);msg('🪨 + камень')}s.combo++;comboTimer=3;s.xp+=8;reward(s.combo>1?'🔥 КОМБО x'+s.combo:'+'+(n.t==='tree'?'🪵':'🪨')) ;if(s.xp>=s.lvl*40){s.xp=0;s.lvl++;msg('⭐ Новый уровень!')}save();ui()}function loot(){let z=null,b=999;C.forEach(ch=>{if(!ch.open){let q=Math.hypot(ch.x-px,ch.z-pz);if(q<b){b=q;z=ch}}});if(!z||b>65)return msg('🎁 Подойдите к сундуку');z.open=true;let coin=25+Math.floor(Math.random()*51),wood=8+Math.floor(Math.random()*13),stone=5+Math.floor(Math.random()*11);s.coins+=coin;if(z.rare){s.rare++;s.weapon++;reward('💎 РЕДКИЙ АРТЕФАКТ · ⚔️ +1')}s.wood+=wood;s.stone+=stone;s.xp+=20;reward('🎁 +'+co
